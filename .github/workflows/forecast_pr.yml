name: Validation météo — Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Tests et validation météo hors réseau
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAIN_NETWORK_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances du module météo
        run: python -m pip install -r requirements-forecast.txt

      - name: Exécuter les tests unitaires météo hors réseau
        run: python -m unittest discover -s tests -p 'test_forecast*.py' -v

      - name: Valider le JSON météorologique
        run: python forecast_update.py --validate

      - name: Vérifier la génération HTML dans le répertoire temporaire
        run: |
          python forecast_update.py --render-only --html "$RUNNER_TEMP/forecast_zp1.html"
          test -s "$RUNNER_TEMP/forecast_zp1.html"

      - name: Vérifier que les fichiers suivis sont inchangés
        run: git diff --exit-code HEAD --
