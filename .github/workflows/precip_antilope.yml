name: Suivi précipitations ANTILOPE (5 min)

on:
  schedule:
    # Filet de sécurité seulement — le rythme régulier toutes les 5 min est
    # assuré par un cron externe (cron-job.org) qui déclenche workflow_dispatch
    # ci-dessous via l'API GitHub. Le schedule natif de GitHub Actions n'a
    # aucune garantie de ponctualité (retards fréquents de plusieurs minutes,
    # voire runs sautés en cas de forte charge) — inutile de compter dessus
    # pour la cadence, mais utile en secours si cron-job.org tombe en panne.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # déclenché toutes les 5 min par cron-job.org (API dispatch), et manuellement depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: precip-antilope
  cancel-in-progress: false  # on met en file plutôt que d'annuler, pour ne pas sauter d'instantané

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances (requests, rasterio, pyproj, h5py uniquement)
        run: pip install requests rasterio pyproj h5py

      - name: Interroger ANTILOPE et mettre à jour le CSV
        env:
          METEOFRANCE_APPLICATION_ID: ${{ secrets.METEOFRANCE_APPLICATION_ID }}
        run: python precip_daily_update.py

      - name: Committer les changements (CSV / état), s'il y en a
        run: |
          git config user.name "precip-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in precip_yavannome.csv precip_antilope_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Rien de nouveau à committer."
          else
            git commit -m "Mise à jour ANTILOPE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
